name: Update Dashboard Data

on:
  push:
    branches: [main]
  schedule:
    # Roda às 15h UTC (12h BRT) entre os dias 9 e 13 para capturar
    # variações no calendário mensal de divulgação do IPCA pelo IBGE.
    # Dia 17 cobre o Zillow ZORI, que costuma sair por volta do dia 16.
    - cron: '0 15 9-13,17 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m src.builders.generate_site

      - name: Validate critical Brazil data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("site/data/brazil/latest.json")
          if not path.exists():
              raise SystemExit("latest.json não foi gerado")

          data = json.loads(path.read_text(encoding="utf-8"))
          grupos = data.get("grupos_data") or {}
          bcb = grupos.get("BCB") or {}
          subnuclei = bcb.get("subnuclei") or []

          if len(subnuclei) < 2:
              raise SystemExit(
                  "Dados críticos do BCB ausentes/incompletos; deploy bloqueado para preservar a versão válida anterior."
              )

          latest_period = (bcb.get("latest") or {}).get("period") or bcb.get("period")
          print(
              f"Validação OK: IPCA {data.get('period')}; núcleos BCB {latest_period}; "
              f"{len(subnuclei)} séries carregadas."
          )
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
